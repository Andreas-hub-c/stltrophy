<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrekenen - Route Trofee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 h-screen w-screen m-0 flex items-center justify-center font-sans">

    <div class="bg-white border border-gray-200 p-8 rounded-lg shadow-xl max-w-md w-full text-center">
        
        <h1 class="text-2xl font-bold mb-2">Jouw 3D Model is klaar!</h1>
        <p class="text-gray-600 mb-8">Reken af om het .3MF bestand direct te downloaden en te printen.</p>

        <!-- Product overzicht -->
        <div class="bg-gray-50 rounded p-4 mb-8 flex justify-between items-center border border-gray-200">
            <div class="text-left">
                <p class="font-bold text-lg">Custom Route Trofee</p>
                <p class="text-sm text-gray-500">.3MF Formaat (Ready to print)</p>
            </div>
            <div class="text-2xl font-bold text-green-600">
                €4,99
            </div>
        </div>

        <button id="payButton" onclick="simulatePayment()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded shadow mb-4">
            Betaal met Bancontact / iDEAL
        </button>

        <div id="successMessage" class="hidden flex-col items-center">
            <div class="text-green-500 mb-2 text-5xl">✓</div>
            <h2 class="text-xl font-bold mb-1">Betaling Geslaagd!</h2>
            <p class="text-gray-600 mb-6">Je download start automatisch...</p>
            
            <a id="downloadLink" href="#" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-6 rounded shadow">
                Klik hier als de download niet start
            </a>
        </div>

        <button onclick="window.location.href='preview.html'" id="backButton" class="mt-4 text-gray-500 hover:text-gray-800 text-sm">
            &larr; Terug naar preview
        </button>
    </div>

    <script>
        async function simulatePayment() {
            const payBtn = document.getElementById('payButton');
            const backBtn = document.getElementById('backButton');
            const successMsg = document.getElementById('successMessage');
            
            payBtn.innerText = "Bezig met verwerken...";
            payBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            await new Promise(resolve => setTimeout(resolve, 1500));

            payBtn.style.display = 'none';
            backBtn.style.display = 'none';
            successMsg.classList.remove('hidden');
            successMsg.classList.add('flex');

            downloadBestand();
        }

        async function downloadBestand() {
            try {
                const blob = await localforage.getItem('final_3mf_file');
                if (!blob) {
                    alert("Fout: Het bestand kon niet gevonden worden. Ga terug en genereer opnieuw.");
                    return;
                }
                const url = URL.createObjectURL(blob);
                const downloadLink = document.getElementById('downloadLink');
                downloadLink.href = url;
                downloadLink.download = "Mijn_Route_Trofee.3mf";
                downloadLink.click();
            } catch (error) {
                console.error("Fout bij ophalen bestand:", error);
                alert("Er ging iets mis met het downloaden van je bestand.");
            }
        }
    </script>
</body>
</html>
