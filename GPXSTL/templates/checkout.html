<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Afrekenen Trofee</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { max-width: 500px; margin: auto; background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; }
        .price { font-size: 28px; color: #38bdf8; font-weight: bold; margin: 20px 0; }
        .pay-btn { background: #22c55e; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .pay-btn:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Ontgrendel High-Res STL</h2>
        <p>Je bent een stap verwijderd van jouw unieke 3D-printbare berglandschap.</p>
        <div class="price">€ 9,99</div>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 30px;">Inclusief onbeperkt printrecht & hoogste detail (Resolutie 150+)</p>
        
        <!-- Hier komt straks jouw Stripe of Mollie betaalknop -->
        <button class="pay-btn" onclick="alert('Hier koppel je straks de Stripe/Mollie betaallink!')">Nu Veilig Afrekenen</button>
    </div>
</body>
</html>
