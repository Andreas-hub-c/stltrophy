<!-- Grid Resolutie -->
<div>
    <div class="flex justify-between items-center mb-1">
        <label class="font-medium">Detail Landschap (Resolutie)</label>
        <span id="val_resolutie" class="text-indigo-600 font-bold bg-indigo-50 px-2 py-1 rounded">50</span>
    </div>
    <p class="text-xs text-gray-500 mb-2">Hogere waarden geven meer detail, maar verhogen de laadtijd.</p>
    <input type="range" id="resolutie" min="50" max="300" step="10" value="50" class="w-full h-2 rounded-lg appearance-none cursor-pointer">
</div>

<!-- Model Grootte -->
<div>
    <div class="flex justify-between items-center mb-1">
        <label class="font-medium">Model Grootte (mm)</label>
        <span id="val_grootte" class="text-indigo-600 font-bold bg-indigo-50 px-2 py-1 rounded">50</span>
    </div>
    <p class="text-xs text-gray-500 mb-2">De fysieke X/Y afmeting van de uiteindelijke 3D print.</p>
    <input type="range" id="grootte" min="50" max="250" step="10" value="50" class="w-full h-2 rounded-lg appearance-none cursor-pointer">
</div>

<!-- Z-Schaal -->
<div>
    <div class="flex justify-between items-center mb-1">
        <label class="font-medium">Hoogte-overdrijving (Z-Schaal)</label>
        <span id="val_zschaal" class="text-indigo-600 font-bold bg-indigo-50 px-2 py-1 rounded">1.0</span>
    </div>
    <p class="text-xs text-gray-500 mb-2">Maakt bergen steiler en dalen dieper voor een dramatischer effect.</p>
    <input type="range" id="zschaal" min="1.0" max="10.0" step="0.1" value="1.0" class="w-full h-2 rounded-lg appearance-none cursor-pointer">
</div>

<!-- Marge -->
<div>
    <div class="flex justify-between items-center mb-1">
        <label class="font-medium">Omgevingsmarge (Graden)</label>
        <span id="val_marge" class="text-indigo-600 font-bold bg-indigo-50 px-2 py-1 rounded">0.01</span>
    </div>
    <p class="text-xs text-gray-500 mb-2">Hoeveel extra landschap er rondom de GPS-route wordt meegenomen.</p>
    <input type="range" id="marge" min="0.01" max="0.10" step="0.01" value="0.01" class="w-full h-2 rounded-lg appearance-none cursor-pointer">
</div>
