<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Preview - Route Trofee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#121212] text-white h-screen w-screen overflow-hidden m-0 flex flex-col relative font-sans">
    
    <div class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-6">
        <!-- Top Bar -->
        <div class="flex justify-between items-start">
            <button onclick="window.location.href='index.html'" class="pointer-events-auto glass-panel hover:bg-white/10 text-white text-sm font-medium py-2.5 px-5 rounded-full shadow-lg transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Terug naar instellingen
            </button>
        </div>

        <!-- Bottom Bar -->
        <div class="flex justify-center md:justify-end items-end pb-4">
            <a id="checkoutBtn" href="checkout.html" class="hidden pointer-events-auto bg-green-600 hover:bg-green-500 text-white font-semibold py-3 px-8 rounded-full shadow-[0_0_20px_rgba(22,163,74,0.4)] transition-all transform hover:scale-105 flex items-center gap-3 tracking-wide">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Ga naar Afrekenen
            </a>
        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full"></div>

    <!-- Professioneel Laadscherm -->
    <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-[#121212] z-20 transition-opacity duration-700">
        <div class="glass-panel p-10 rounded-3xl shadow-2xl text-center max-w-sm flex flex-col items-center">
            <div class="relative w-16 h-16 mb-6">
                <div class="absolute inset-0 rounded-full border-t-2 border-blue-500 animate-spin"></div>
                <div class="absolute inset-2 rounded-full border-r-2 border-teal-400 animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
            </div>
            <h2 class="text-xl font-semibold mb-2 text-white tracking-wide">Model Genereren</h2>
            <p id="statusText" class="text-gray-400 text-sm">Dit kan 1 tot 3 minuten duren...</p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

        // --- 1. Professionele Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x121212, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.VSMShadowMap; 
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.maxPolarAngle = Math.PI / 2;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(100, 200, 100);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.bias = -0.001;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x90b0d0, 0.4);
        fillLight.position.set(-100, 50, -100);
        scene.add(fillLight);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. Data ophalen en 3MF inladen ---
        const statusText = document.getElementById('statusText');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const checkoutBtn = document.getElementById('checkoutBtn');

        async function fetchAndRender3MF() {
            try {
                const gpxString = await localforage.getItem('gpxData');
                if (!gpxString) throw new Error("Geen GPX data. Ga terug naar de startpagina.");

                statusText.innerText = "Bezig met bouwen van 3D model...";
                
                const formData = new FormData();
                formData.append('gpxFile', new Blob([gpxString], { type: 'application/gpx+xml' }), 'route.gpx');

                const params = ['resolutie', 'marge', 'breedte', 'dikte', 'zschaal', 'grootte', 'boordmarge', 'boorddikte'];
                params.forEach(param => {
                    const val = sessionStorage.getItem(param);
                    if (val) formData.append(param, val);
                });

                const response = await fetch('/api/generate', { method: 'POST', body: formData });
                if (!response.ok) throw new Error("Server kon het bestand niet genereren.");

                statusText.innerText = "Bestand klaar! Inladen voor preview...";
                
                const blob = await response.blob();
                
                // BELANGRIJK: Sla het uiteindelijke 3MF bestand op in de browser voor de kassa!
                await localforage.setItem('final_3mf_file', blob);

                const arrayBuffer = await blob.arrayBuffer();
                const loader = new ThreeMFLoader();
                
                try {
                    const object = loader.parse(arrayBuffer);

                    object.traverse(function (child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            let oldMat = child.material;
                            let newMat = new THREE.MeshStandardMaterial({
                                color: oldMat.color || 0xffffff,
                                roughness: 0.65,
                                metalness: 0.05,
                                side: THREE.DoubleSide
                            });
                            if (oldMat.vertexColors || (child.geometry && child.geometry.hasAttribute('color'))) {
                                newMat.vertexColors = true;
                            }
                            child.material = newMat;
                        }
                    });
                    
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    object.position.sub(center); 
                    object.rotation.x = -Math.PI / 2;

                    scene.add(object);
                    
                    const size = box.getSize(new THREE.Vector3()).length();
                    camera.position.set(0, size * 0.8, size * 1.0);
                    controls.target.set(0, 0, 0);
                    controls.maxDistance = size * 2.5;
                    controls.update();

                    loadingOverlay.style.opacity = "0";
                    setTimeout(() => loadingOverlay.remove(), 700);
                    
                    // Toon de Checkout knop
                    checkoutBtn.classList.remove('hidden');
                    
                } catch (parseError) {
                    console.error(parseError);
                    throw new Error("Het bestand is te zwaar voor de preview, maar je kunt het wel afrekenen en downloaden.");
                }

            } catch (error) {
                loadingOverlay.innerHTML = `
                    <div class="glass-panel p-8 rounded-2xl border border-red-500/30 max-w-sm text-center">
                        <p class="text-white font-semibold mb-2">Er ging iets mis</p>
                        <p class="text-sm text-gray-400 mb-6">${error.message}</p>
                        <button onclick="window.location.href='index.html'" class="bg-white/10 hover:bg-white/20 text-white px-5 py-2.5 rounded-full text-sm font-medium w-full">Terug</button>
                    </div>
                `;
            }
        }

        fetchAndRender3MF();
    </script>
</body>
</html>
