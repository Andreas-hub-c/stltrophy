<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview 3D Model - Route Trofee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 h-screen w-screen overflow-hidden m-0 flex flex-col relative">
    
    <!-- Knoppen balk over het canvas -->
    <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-10 pointer-events-none">
        <button onclick="window.location.href='index.html'" class="pointer-events-auto bg-white hover:bg-gray-50 border border-gray-300 text-gray-800 font-bold py-2 px-6 rounded shadow transition-colors">
            &larr; Terug
        </button>
        <!-- Deze knop verschijnt pas als het model geladen is -->
        <a id="checkoutBtn" href="checkout.html" class="hidden pointer-events-auto bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded shadow-lg text-lg transition-transform transform hover:scale-105">
            Ga naar Afrekenen &rarr;
        </a>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container" class="w-full h-full"></div>

    <!-- Witte Loading Overlay -->
    <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-gray-100/90 z-20">
        <div class="bg-white p-8 rounded-lg shadow-xl text-center max-w-md border border-gray-200">
            <div class="animate-spin inline-block w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mb-4"></div>
            <h2 class="text-xl font-bold mb-2">Model Genereren</h2>
            <p id="statusText" class="text-gray-600">GPX data ophalen...</p>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

        // --- 1. Three.js Setup (Licht & Wit) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf3f4f6); // Zelfde kleur als Tailwind bg-gray-100
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(0, 200, 200);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2;

        // Normale, heldere belichting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. Jouw fetchAndRender3MF code ---
        const statusText = document.getElementById('statusText');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const checkoutBtn = document.getElementById('checkoutBtn');

        async function fetchAndRender3MF() {
            try {
                statusText.innerText = "GPX data ophalen...";
                const gpxString = await localforage.getItem('gpxData');
                
                if (!gpxString) {
                    throw new Error("Geen GPX bestand gevonden. Ga terug naar de startpagina en upload opnieuw.");
                }

                statusText.innerText = "Model wordt gegenereerd op de server (dit kan 1-2 minuten duren)...";
                const formData = new FormData();
                const gpxBlob = new Blob([gpxString], { type: 'application/gpx+xml' });
                formData.append('gpxFile', gpxBlob, 'route.gpx');

                const params = ['resolutie', 'marge', 'breedte', 'dikte', 'zschaal', 'grootte', 'boordmarge', 'boorddikte'];
                params.forEach(param => {
                    const val = sessionStorage.getItem(param);
                    if (val) formData.append(param, val);
                });

                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server gaf foutcode ${response.status} terug.`);
                }

                statusText.innerText = "Bestand ontvangen! 3D model uitpakken en opbouwen...";
                console.log("Start met downloaden van data...");
                
                // BELANGRIJK: Hier halen we de blob op en slaan hem op voor de checkout pagina
                const blob = await response.blob();
                await localforage.setItem('final_3mf_file', blob);

                const arrayBuffer = await blob.arrayBuffer();
                console.log("Bestandsgrootte ontvangen:", (arrayBuffer.byteLength / 1024 / 1024).toFixed(2), "MB");

                // Nu laden we het in Three.js
                const loader = new ThreeMFLoader();
                
                try {
                    console.log("Start met parsen van 3MF...");
                    const object = loader.parse(arrayBuffer);
                    
                    console.log("Parsen gelukt! Model toevoegen aan scherm...");
                    
                    // Schone, matte kleuren toewijzen op basis van de namen in Python zodat het niet meer grijs is
                    object.traverse(function (child) {
                        if (child.isMesh) {
                            const name = child.name ? child.name.toLowerCase() : "";
                            let colorHex = 0xcccccc; // standaard grijs als fallback
                            
                            if (name.includes('sokkel')) colorHex = 0x222222; // donkergrijs/zwart
                            else if (name.includes('terrein')) colorHex = 0x4ade80; // fris groen
                            else if (name.includes('water')) colorHex = 0x3b82f6; // blauw
                            else if (name.includes('route')) colorHex = 0xef4444; // rood

                            // Simpel materiaal zodat het er strak uit ziet
                            child.material = new THREE.MeshStandardMaterial({
                                color: colorHex,
                                roughness: 0.9,
                                metalness: 0.0
                            });
                        }
                    });
                    
                    // Zet model mooi in het midden
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    object.position.sub(center);
                    
                    // 3MF's plat leggen
                    object.rotation.x = -Math.PI / 2;

                    scene.add(object);
                    
                    // Zoom camera automatisch goed uit
                    const size = box.getSize(new THREE.Vector3()).length();
                    camera.position.set(0, size * 0.8, size * 0.8);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    // Laadscherm verbergen en checkout knop tonen
                    loadingOverlay.classList.add('hidden');
                    checkoutBtn.classList.remove('hidden');
                    
                } catch (parseError) {
                    console.error("Fout tijdens het uitpakken in Three.js:", parseError);
                    throw new Error("Het model is te gedetailleerd voor deze browser om als preview te tonen, maar je kunt wel doorgaan naar afrekenen.");
                }

            } catch (error) {
                console.error("Fout bij laden:", error);
                loadingOverlay.innerHTML = `
                    <div class="bg-white p-6 rounded-lg border border-red-500 max-w-sm text-center shadow-lg pointer-events-auto">
                        <p class="text-red-500 font-bold text-lg mb-2">Er ging iets mis</p>
                        <p class="text-sm text-gray-600 mb-6">${error.message}</p>
                        <!-- Als het model wel gemaakt is, maar crashte bij preview, toon dan toch de afreken knop -->
                        ${checkoutBtn.classList.contains('hidden') === false ? `<a href="checkout.html" class="bg-green-600 text-white px-4 py-2 font-bold rounded hover:bg-green-500 mb-2 block">Doorgaan naar Afrekenen</a>` : ''}
                        <button onclick="window.location.href='index.html'" class="bg-gray-200 text-gray-900 px-4 py-2 font-bold rounded hover:bg-gray-300 w-full">Terug naar begin</button>
                    </div>
                `;
            }
        }

        // Start het proces
        fetchAndRender3MF();
    </script>
</body>
</html>
