<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview - 3D Route Trofee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased p-6 md:p-12">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-indigo-600 p-8 text-white text-center">
            <h1 class="text-3xl font-bold mb-2">Jouw 3D Route Trofee Preview</h1>
            <p class="text-indigo-200">Draai en inspecteer je model hieronder.</p>
        </div>

        <div class="p-8 space-y-8">
            <!-- 3D Viewer Container -->
            <div class="border border-gray-200 rounded-2xl overflow-hidden relative bg-gray-900 h-[450px] shadow-inner">
                <div id="canvas-container" class="w-full h-full"></div>
                
                <!-- Handige 3D Viewer Besturingsknoppen -->
                <div class="absolute bottom-4 right-4 z-10 flex gap-2 bg-white/90 backdrop-blur p-2 rounded-xl shadow-lg border border-gray-200">
                    <button id="btnZoomIn" title="Inzoomen" class="p-2 hover:bg-gray-100 rounded-lg text-gray-700 font-bold transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                    <button id="btnZoomOut" title="Uitzoomen" class="p-2 hover:bg-gray-100 rounded-lg text-gray-700 font-bold transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                    </button>
                    <div class="w-px bg-gray-300 my-1"></div>
                    <button id="btnReset" title="Reset Camera Positie" class="px-3 py-1 hover:bg-gray-100 rounded-lg text-xs font-semibold text-gray-700 transition">
                        Reset Weergave
                    </button>
                </div>

                <!-- Loading Overlay -->
                <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-20 p-6 text-center">
                    <div class="animate-spin inline-block w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full mb-4"></div>
                    <h2 class="text-xl font-bold mb-1 text-gray-900">Model Genereren</h2>
                    <p id="statusText" class="text-gray-500 text-sm">GPX data ophalen en berekenen...</p>
                </div>
            </div>

            <!-- Product & Prijs Overzicht -->
            <div class="bg-gray-50 rounded-xl p-6 border border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h3 class="font-bold text-lg text-gray-900">Custom Route Trofee (.3MF)</h3>
                    <p class="text-sm text-gray-500">Inclusief terrein, water, wandelroute en zwarte sokkel.</p>
                </div>
                <div class="text-2xl font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-xl">
                    €4,99
                </div>
            </div>

            <!-- Actie Knoppen -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 pt-4 border-t border-gray-200">
                <button onclick="window.location.href='index.html'" class="w-full md:w-auto bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 font-bold py-3 px-6 rounded-lg shadow transition duration-200">
                    &larr; Terug naar instellingen
                </button>
                
                <a id="checkoutBtn" href="checkout.html" class="hidden w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    Doorgaan naar Afrekenen
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf8fafc);
        
        let width = container.clientWidth;
        let height = container.clientHeight;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 50000);
        let defaultCameraPosition = new THREE.Vector3(0, 200, 200);
        camera.position.copy(defaultCameraPosition);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        
        // --- SCHADUWEN ACTIEF MAKEN OP RENDERER ---
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Omgevingslicht voor basiszichtbaarheid
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Hoofdlicht dat schaduwen werpt en zorgt voor diepte op de bergen
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.3);
        mainLight.position.set(150, 300, 150);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.bias = -0.0001;
        scene.add(mainLight);

        // Subtiel invullicht van de andere kant
        const fillLight = new THREE.DirectionalLight(0x90b0ff, 0.4);
        fillLight.position.set(-150, 100, -150);
        scene.add(fillLight);

        document.getElementById('btnZoomIn').addEventListener('click', () => {
            camera.position.lerp(controls.target, 0.15);
        });

        document.getElementById('btnZoomOut').addEventListener('click', () => {
            camera.position.lerp(controls.target, -0.15);
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            camera.position.copy(defaultCameraPosition);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        window.addEventListener('resize', () => {
            width = container.clientWidth;
            height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        const statusText = document.getElementById('statusText');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const checkoutBtn = document.getElementById('checkoutBtn');

        async function fetchAndRender3MF() {
            try {
                statusText.innerText = "GPX data ophalen...";
                const gpxString = await localforage.getItem('gpxData');
                
                if (!gpxString) {
                    throw new Error("Geen GPX bestand gevonden. Ga terug naar de startpagina.");
                }

                statusText.innerText = "Model wordt gegenereerd op de server (dit kan even duren)...";
                const formData = new FormData();
                const gpxBlob = new Blob([gpxString], { type: 'application/gpx+xml' });
                formData.append('gpxFile', gpxBlob, 'route.gpx');

                const params = ['resolutie', 'marge', 'breedte', 'dikte', 'zschaal', 'grootte', 'boordmarge', 'boorddikte', 'water_diepte', 'min_water_grootte'];
                params.forEach(param => {
                    const val = sessionStorage.getItem(param);
                    if (val) formData.append(param, val);
                });

                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server gaf foutcode ${response.status} terug.`);
                }

                statusText.innerText = "Bestand ontvangen! Model inladen...";
                
                const blob = await response.blob();
                await localforage.setItem('final_3mf_file', blob);

                const arrayBuffer = await blob.arrayBuffer();
                const loader = new ThreeMFLoader();
                
                try {
                    const object = loader.parse(arrayBuffer);
                    
                    const matSokkel = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7, metalness: 0.1 });
                    const matTerrein = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8, metalness: 0.05 });
                    const matWater = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.2, metalness: 0.1 });
                    const matRoute = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4, metalness: 0.1 });

                    object.traverse(function (child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            
                            // Bereken normals zodat licht en schaduw correct over het terrein vloeien
                            if (child.geometry) {
                                child.geometry.computeVertexNormals();
                            }

                            const name = child.name ? child.name.toLowerCase() : "";
                            if (name.includes('sokkel')) {
                                child.material = matSokkel;
                            } else if (name.includes('terrein')) {
                                child.material = matTerrein;
                            } else if (name.includes('water')) {
                                child.material = matWater;
                            } else if (name.includes('route')) {
                                child.material = matRoute;
                            }
                        }
                    });

                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    object.position.sub(center);
                    object.rotation.x = -Math.PI / 2;

                    scene.add(object);
                    
                    const size = box.getSize(new THREE.Vector3()).length();
                    defaultCameraPosition.set(0, size * 0.8, size * 0.8);
                    camera.position.copy(defaultCameraPosition);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    loadingOverlay.classList.add('hidden');
                    checkoutBtn.classList.remove('hidden');
                    
                } catch (parseError) {
                    console.error("Fout tijdens parsen:", parseError);
                    throw new Error("Het model is te gedetailleerd voor deze browser preview, maar je kunt wel doorgaan naar afrekenen.");
                }

            } catch (error) {
                console.error("Fout bij laden:", error);
                loadingOverlay.innerHTML = `
                    <div class="p-4 text-center">
                        <p class="text-red-600 font-bold mb-2">Er ging iets mis</p>
                        <p class="text-sm text-gray-600 mb-4">${error.message}</p>
                        <button onclick="window.location.href='index.html'" class="bg-indigo-600 text-white px-4 py-2 font-bold rounded-lg hover:bg-indigo-700">Terug naar begin</button>
                    </div>
                `;
                checkoutBtn.classList.remove('hidden');
            }
        }

        fetchAndRender3MF();
    </script>
</body>
</html>
