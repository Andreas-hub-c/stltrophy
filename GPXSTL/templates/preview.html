<!-- Three.js Logica -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

        const container = document.getElementById('viewer-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111827); 

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 2000);
        camera.position.set(150, 150, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 200, 100);
        scene.add(directionalLight);

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // HIER START DE ECHTE KOPPELING MET JOUW SERVER
        async function fetchAndRender3MF() {
            try {
                // 1. Haal de GPX tekst op die index.html in het geheugen heeft gezet
                const gpxString = sessionStorage.getItem('gpxData');
                if (!gpxString) {
                    throw new Error("Geen GPX bestand gevonden in het geheugen. Ga terug naar de startpagina en upload opnieuw.");
                }

                // 2. Bouw het pakketje op voor de Flask API
                const formData = new FormData();
                // We maken van de tekst weer een bestandstype zodat Flask hem herkent
                const gpxBlob = new Blob([gpxString], { type: 'application/gpx+xml' });
                formData.append('gpxFile', gpxBlob, 'route.gpx');

                // Voeg optionele slider waarden toe (als ze niet bestaan, pakt de backend je defaults)
                const params = ['resolutie', 'marge', 'breedte', 'dikte', 'zschaal', 'grootte', 'boordmarge', 'boorddikte'];
                params.forEach(param => {
                    const val = sessionStorage.getItem(param);
                    if (val) formData.append(param, val);
                });

                // 3. Stuur naar jouw Flask backend op Render
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `Server gaf foutcode ${response.status} terug.`);
                }

                // 4. Converteer de reactie (de 3MF download) naar ruwe bytes (ArrayBuffer)
                const arrayBuffer = await response.arrayBuffer();

                // 5. Laad dit in via de ThreeMFLoader
                const loader = new ThreeMFLoader();
                loader.parse(arrayBuffer, function ( object ) {
                    // Zet het model exact in het midden van het scherm
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    object.position.sub(center);
                    
                    // Z-up naar Y-up correctie (vaak nodig bij 3D print software)
                    object.rotation.x = -Math.PI / 2;

                    scene.add( object );
                    
                    // Verberg het laadscherm als we succesvol zijn
                    loadingOverlay.classList.add('hidden');
                });

            } catch (error) {
                console.error("Fout bij laden:", error);
                loadingOverlay.innerHTML = `
                    <p class="text-red-400 font-bold text-lg mb-2">Er ging iets mis :(</p>
                    <p class="text-sm text-gray-300 px-6 text-center">${error.message}</p>
                    <button onclick="window.location.href='index.html'" class="mt-6 bg-white text-gray-900 px-4 py-2 font-bold rounded text-sm hover:bg-gray-200 shadow">Terug naar begin</button>
                `;
            }
        }

        fetchAndRender3MF();
    </script>
</body>
</html>
